<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About – My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div class="logo">Hendrick<span>Landeweerd</span></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-content">
        <div>
          <h1>Hello! My name is Hendrick, welcome to my portfolio!</h1>
          <p>
            This is a website made to showcase projects that I have made during my time at Creative Technology.
            Feel free to explore and discover about me and my projects.
          </p>
          <a href="about.html" class="btn-primary">About me</a>
          <a href="projects.html" class="btn-primary">Projects</a>
          <a href="contact.html" class="btn-primary">Contact</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });

    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function (e) {
        const href = this.getAttribute('href');

        if (
          href &&
          !href.startsWith('#') &&
          !href.startsWith('http') &&
          !href.startsWith('mailto:') &&
          !href.startsWith('tel:') &&
          !this.hasAttribute('target') &&
          !this.hasAttribute('download')
        ) {
          e.preventDefault();
          document.body.classList.remove('loaded');
          document.body.classList.add('fade-out');

          setTimeout(() => {
            window.location.href = href;
          }, 350);
        }
      });
    });
  </script>
</body>
</html>
